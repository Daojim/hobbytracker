<!--
  HobbyTracker's tab icon: icons/icon.svg's drawing, simplified for 16px.

  At that size the poster on each cover is a smudge, so it goes, and the tick grows. The
  ground is a rounded tile rather than full bleed, because a browser shows a favicon as it is
  drawn. Served as it stands, and rendered to favicon.ico by icons/render.mjs for whatever asks
  for that file by name. Colours are icon.svg's; see there.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1aa2eb"/>
      <stop offset="1" stop-color="#2663c9"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#da7e1e"/>
      <stop offset="1" stop-color="#b6303e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#efe9e1"/>

  <g transform="translate(34.3 28.27) scale(1.2379)">
    <rect x="-85" y="-119" width="170" height="238" rx="16" fill="url(#back)"
      transform="translate(118 150) rotate(-9)"/>
    <rect x="-85" y="-119" width="170" height="238" rx="16" fill="url(#front)"
      transform="translate(222 176) rotate(6)"/>
    <circle cx="280.75" cy="286.75" r="62" fill="#1f6b5e" stroke="#efe9e1" stroke-width="12"/>
    <path d="M253.79 288.1 L272.66 306.96 L309.05 267.88" fill="none" stroke="#fffdfa"
      stroke-width="14.83" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
