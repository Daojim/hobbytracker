<!--
  HobbyTracker's tab icon: icons/icon.svg's drawing, simplified for 16px.

  At that size three stickers are a smudge, so the notebook keeps one, the controller, drawn
  larger, with bigger buttons and no start or select. The ground is a rounded tile rather than
  full bleed, because a browser shows a favicon as it is drawn. Served as it stands, and
  rendered to favicon.ico by icons/render.mjs for whatever asks for that file by name. Colours
  are icon.svg's; see there.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <g id="controller">
      <use href="#controller-outline" fill="#2663c9"/>
      <rect x="-88" y="-19" width="52" height="18" rx="5" fill="#211c17"/>
      <rect x="-71" y="-36" width="18" height="52" rx="5" fill="#211c17"/>
      <circle cx="62" cy="-29" r="12" fill="#d9a440"/>
      <circle cx="81" cy="-10" r="12" fill="#b6303e"/>
      <circle cx="62" cy="9" r="12" fill="#3e9727"/>
      <circle cx="43" cy="-10" r="12" fill="#1aa2eb"/>
    </g>
    <g id="controller-outline">
      <rect x="-108" y="-52" width="216" height="88" rx="44"/>
      <ellipse cx="-74" cy="26" rx="40" ry="50" transform="rotate(22 -74 26)"/>
      <ellipse cx="74" cy="26" rx="40" ry="50" transform="rotate(-22 74 26)"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="#efe9e1"/>

  <g transform="translate(249.1 233.32) scale(0.98592)">
    <!-- The pages, showing at the fore-edge behind the board. -->
    <rect x="-136" y="-180" width="300" height="360" rx="18" fill="#fffdfa"/>
    <rect x="-136" y="-180" width="300" height="360" rx="18" fill="none" stroke="#211c17" stroke-opacity="0.12"
      stroke-width="3"/>
    <!-- The ribbon, hanging out of the bottom. -->
    <path d="M-92 170 L-92 236 L-78 224 L-64 236 L-64 170 Z" fill="#b6303e"/>
    <!-- The board, and the elastic that holds it shut. -->
    <rect x="-150" y="-190" width="300" height="380" rx="24" fill="#211c17"/>
    <rect x="92" y="-190" width="16" height="380" fill="#da7e1e"/>

    <!-- The controller. -->
    <g transform="translate(-30 11) rotate(-12) scale(0.82)" opacity="0.16">
      <use href="#controller-outline" fill="#211c17" stroke="#211c17" stroke-width="36.59" stroke-linejoin="round"/>
    </g>
    <g transform="translate(-30 4) rotate(-12) scale(0.82)">
      <use href="#controller-outline" fill="#fffdfa" stroke="#fffdfa" stroke-width="36.59" stroke-linejoin="round"/>
      <use href="#controller"/>
    </g>
  </g>
</svg>
