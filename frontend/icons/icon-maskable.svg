<!--
  HobbyTracker's icon, for a launcher that crops it.

  icon.svg's drawing, smaller: everything that matters sits inside a circle 80% of the width
  across, which is the spec's safe zone for a maskable icon. Android crops to whatever shape the
  launcher uses (a circle on a Pixel, a squircle elsewhere) and that circle survives all of them.
  The ground is full bleed so the crop never shows an edge. Colours are icon.svg's; see there.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <g id="controller">
      <use href="#controller-outline" fill="#2663c9"/>
      <rect x="-88" y="-19" width="52" height="18" rx="5" fill="#211c17"/>
      <rect x="-71" y="-36" width="18" height="52" rx="5" fill="#211c17"/>
      <circle cx="62" cy="-29" r="10.5" fill="#d9a440"/>
      <circle cx="81" cy="-10" r="10.5" fill="#b6303e"/>
      <circle cx="62" cy="9" r="10.5" fill="#3e9727"/>
      <circle cx="43" cy="-10" r="10.5" fill="#1aa2eb"/>
      <rect x="-25" y="-36" width="18" height="8" rx="4" fill="#211c17" opacity="0.55"/>
      <rect x="7" y="-36" width="18" height="8" rx="4" fill="#211c17" opacity="0.55"/>
    </g>
    <g id="controller-outline">
      <rect x="-108" y="-52" width="216" height="88" rx="44"/>
      <ellipse cx="-74" cy="26" rx="40" ry="50" transform="rotate(22 -74 26)"/>
      <ellipse cx="74" cy="26" rx="40" ry="50" transform="rotate(-22 74 26)"/>
    </g>
    <g id="tv">
      <use href="#tv-ears" fill="none" stroke="#211c17" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-52" cy="-136" r="10" fill="#211c17"/>
      <circle cx="46" cy="-144" r="10" fill="#211c17"/>
      <path d="M-28 -78 A28 21 0 0 1 28 -78 Z" fill="#211c17"/>
      <rect x="-86" y="76" width="28" height="18" rx="6" fill="#211c17"/>
      <rect x="58" y="76" width="28" height="18" rx="6" fill="#211c17"/>
      <rect x="-112" y="-80" width="224" height="160" rx="30" fill="#da7e1e"/>
      <rect x="-94" y="-62" width="146" height="124" rx="24" fill="#211c17"/>
      <path d="M-81 -18 L-81 -36 Q-81 -49 -68 -49 L-44 -49" fill="none" stroke="#fffdfa" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
      <circle cx="83" cy="-36" r="12" fill="#bb6300"/>
      <circle cx="83" cy="-4" r="12" fill="#bb6300"/>
      <rect x="71" y="22" width="24" height="5" rx="2.5" fill="#bb6300"/>
      <rect x="71" y="33" width="24" height="5" rx="2.5" fill="#bb6300"/>
      <rect x="71" y="44" width="24" height="5" rx="2.5" fill="#bb6300"/>
    </g>
    <g id="tv-ears">
      <path d="M0 -78 L-52 -136"/>
      <path d="M0 -78 L46 -144"/>
    </g>
    <g id="tv-outline">
      <circle cx="-52" cy="-136" r="10"/>
      <circle cx="46" cy="-144" r="10"/>
      <path d="M-28 -78 A28 21 0 0 1 28 -78 Z"/>
      <rect x="-86" y="76" width="28" height="18" rx="6"/>
      <rect x="58" y="76" width="28" height="18" rx="6"/>
      <rect x="-112" y="-80" width="224" height="160" rx="30"/>
    </g>
    <g id="headphones">
      <use href="#headphones-band" fill="none" stroke="#602e9d" stroke-width="18" stroke-linecap="round"/>
      <rect x="-108" y="4" width="46" height="84" rx="21" fill="#7a4aba"/>
      <rect x="62" y="4" width="46" height="84" rx="21" fill="#7a4aba"/>
      <rect x="-70" y="15" width="18" height="62" rx="9" fill="#410f73"/>
      <rect x="52" y="15" width="18" height="62" rx="9" fill="#410f73"/>
    </g>
    <path id="headphones-band" d="M-80 34 L-80 0 A80 80 0 0 1 80 0 L80 34"/>
    <g id="headphones-outline">
      <rect x="-108" y="4" width="46" height="84" rx="21"/>
      <rect x="62" y="4" width="46" height="84" rx="21"/>
      <rect x="-70" y="15" width="18" height="62" rx="9"/>
      <rect x="52" y="15" width="18" height="62" rx="9"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="#efe9e1"/>

  <g transform="translate(250.81 238.96) scale(0.74072)">
    <!-- The pages, showing at the fore-edge behind the board. -->
    <rect x="-136" y="-180" width="300" height="360" rx="18" fill="#fffdfa"/>
    <rect x="-136" y="-180" width="300" height="360" rx="18" fill="none" stroke="#211c17" stroke-opacity="0.12"
      stroke-width="3"/>
    <!-- The ribbon, hanging out of the bottom. -->
    <path d="M-92 170 L-92 236 L-78 224 L-64 236 L-64 170 Z" fill="#b6303e"/>
    <!-- The board, and the elastic that holds it shut. -->
    <rect x="-150" y="-190" width="300" height="380" rx="24" fill="#211c17"/>
    <rect x="92" y="-190" width="16" height="380" fill="#da7e1e"/>

    <!-- The controller. -->
    <g transform="translate(-28 -97) rotate(-8) scale(0.74)" opacity="0.16">
      <use href="#controller-outline" fill="#211c17" stroke="#211c17" stroke-width="40.54" stroke-linejoin="round"/>
    </g>
    <g transform="translate(-28 -104) rotate(-8) scale(0.74)">
      <use href="#controller-outline" fill="#fffdfa" stroke="#fffdfa" stroke-width="40.54" stroke-linejoin="round"/>
      <use href="#controller"/>
    </g>

    <!-- The television. Its ears are lines, so their outline is a wider line. -->
    <g transform="translate(-54 53) rotate(6) scale(0.5)" opacity="0.16">
      <use href="#tv-outline" fill="#211c17" stroke="#211c17" stroke-width="60" stroke-linejoin="round"/>
      <use href="#tv-ears" fill="none" stroke="#211c17" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(-54 46) rotate(6) scale(0.5)">
      <use href="#tv-outline" fill="#fffdfa" stroke="#fffdfa" stroke-width="60" stroke-linejoin="round"/>
      <use href="#tv-ears" fill="none" stroke="#fffdfa" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#tv"/>
    </g>

    <!-- The headphones. The band is a line too. -->
    <g transform="translate(22 125) rotate(-9) scale(0.46)" opacity="0.16">
      <use href="#headphones-outline" fill="#211c17" stroke="#211c17" stroke-width="65.22" stroke-linejoin="round"/>
      <use href="#headphones-band" fill="none" stroke="#211c17" stroke-width="83.22" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(22 118) rotate(-9) scale(0.46)">
      <use href="#headphones-outline" fill="#fffdfa" stroke="#fffdfa" stroke-width="65.22" stroke-linejoin="round"/>
      <use href="#headphones-band" fill="none" stroke="#fffdfa" stroke-width="83.22" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#headphones"/>
    </g>
  </g>
</svg>
