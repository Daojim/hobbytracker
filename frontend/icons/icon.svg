<!--
  HobbyTracker's icon: two pieces of box art, the front one ticked off.

  This is the plain composition, drawn full bleed because iOS and Android round the corners
  themselves. render.mjs turns it into apple-touch-icon.png, icon-192.png and icon-512.png.
  icon-maskable.svg is the same drawing smaller, and public/favicon.svg a simpler one; render.mjs
  says why there are three.

  The colours are the app's own, copied rather than linked, because an icon is drawn before any
  stylesheet exists. (Named here without their two leading hyphens: XML refuses a double hyphen
  inside a comment, and an SVG that is not XML is not drawn at all.)
    ground  #efe9e1            Shelf Light's ground, its sunken token. manifest.test.ts holds this.
    back    #1aa2eb → #2663c9  the games genres Shooter → Platform
    front   #da7e1e → #b6303e  Strategy → Brawler
    tick    #1f6b5e, #fffdfa   Shelf Light's accent and surface tokens

  Picked on 2 October 2026 from four drawings on four grounds. See docs/design.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1aa2eb"/>
      <stop offset="1" stop-color="#2663c9"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#da7e1e"/>
      <stop offset="1" stop-color="#b6303e"/>
    </linearGradient>

    <!-- A cover, centred on its own origin. 170 × 238 is 5:7, the shape of every cover in the app. -->
    <clipPath id="cover">
      <rect x="-85" y="-119" width="170" height="238" rx="16"/>
    </clipPath>

    <!-- What makes it box art rather than a photo: a round shape and a title, as a poster has. -->
    <g id="poster">
      <g clip-path="url(#cover)">
        <circle cx="20.4" cy="0" r="71.4" fill="#fff" fill-opacity="0.3"/>
        <circle cx="20.4" cy="0" r="40.8" fill="#fff" fill-opacity="0.45"/>
      </g>
      <rect x="-61.2" y="-95.2" width="95.2" height="16.66" rx="8.33" fill="#fff" fill-opacity="0.85"/>
      <rect x="-61.2" y="-69.02" width="57.8" height="10.71" rx="5.36" fill="#fff" fill-opacity="0.6"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="#efe9e1"/>

  <g transform="translate(73.25 68.04) scale(1.0682)">
    <g transform="translate(118 150) rotate(-9)">
      <rect x="-85" y="-119" width="170" height="238" rx="16" fill="url(#back)"/>
      <use href="#poster"/>
    </g>
    <g transform="translate(222 176) rotate(6)">
      <rect x="-85" y="-119" width="170" height="238" rx="16" fill="url(#front)"/>
      <use href="#poster"/>
    </g>

    <!-- The tick, ringed in the ground so it sits on the cover rather than in it. -->
    <circle cx="280.75" cy="286.75" r="46" fill="#1f6b5e" stroke="#efe9e1" stroke-width="10"/>
    <path d="M260.75 287.75 L274.75 301.75 L301.75 272.75" fill="none" stroke="#fffdfa"
      stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
