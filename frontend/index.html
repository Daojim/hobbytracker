<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HobbyTracker</title>

    <!--
      The icon, in a tab and on a home screen. The .ico carries sizes="32x32" so that Chrome
      takes the SVG instead of fetching both and preferring the .ico. Everything named here is a
      file in public/, which Vite copies across without fingerprinting it; manifest.test.ts
      checks each one is there and is the size it says. The manifest is System's: a chosen theme
      links its own in its place, from the script below and then from applyTheme.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      The bar above the page: Chrome's on Android, and the status bar of the installed app. Each
      theme's is its ground, the sunken token in index.css, which is what every page is painted
      on. These two answer for System, one per colour scheme, and nothing ever changes them. A
      chosen theme gets a third tag ahead of them, from the script below and then from applyTheme,
      because a browser takes the first one that matches. The installed app's bar at the bottom
      reads none of them: it is the manifest's theme_color, which is why a theme links its own.
    -->
    <meta name="theme-color" content="#efe9e1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />

    <!--
      The chosen theme, stamped before anything paints.

      This has to run here rather than in React. The bundle is fetched, parsed and mounted well
      after the first paint, so a theme applied there shows the default palette first and swaps —
      which reads as a flash of the wrong colours on every load, and is invisible in development
      where the bundle is already warm.

      It cannot import src/theme/theme.ts, so the keys and attribute names are repeated as
      literals. theme.test.ts reads this file and asserts the copies still match, because a
      renamed key here fails by silently ignoring the preference rather than by breaking. The same
      goes for each theme's ground, the one colour this file has to know before index.css loads.

      A theme of your own (#28) is stamped here too, or it would be the one theme that repaints
      after the bundle mounts: its base as the attribute, and the values kept for it set inline
      on the root, over the base's block. The bundle works them out when the theme is kept, so
      this only copies.

      Wrapped in try/catch: reading localStorage throws outright in a browser set to block site
      data, and an exception at this point is a blank page rather than a wrong colour.
    -->
    <script>
      (function () {
        try {
          // Every theme, and its ground.
          var grounds = {
            'shelf-light': '#efe9e1', 'frost': '#e4e9f0', 'almanac': '#e5d9bf',
            'dusk': '#2a323c', 'blood-red': '#430404',
            'shelf-dark': '#16130f', 'console': '#0a0c10', 'ember': '#121110',
          };
          var root = document.documentElement;
          var theme = localStorage.getItem('hobbytracker.theme');
          var mine = null;
          var ground = null;

          // A theme of your own: one of the eight underneath, so a token not kept is still
          // answered by its block. A record that is not JSON, or made from a theme that is gone,
          // falls back to System as an unknown name does. readMine in theme.ts keeps the same
          // record by the same rules, and theme.test.ts runs the two on one record.
          if (theme === 'mine') {
            try {
              mine = JSON.parse(localStorage.getItem('hobbytracker.theme.mine'));
            } catch (unreadable) {
              mine = null;
            }
            if (
              mine &&
              typeof mine.tokens === 'object' &&
              mine.tokens !== null &&
              Object.prototype.hasOwnProperty.call(grounds, mine.from)
            ) {
              theme = mine.from;
              if (/^#[0-9a-f]{6}$/.test(mine.tokens['--sunken'])) {
                ground = mine.tokens['--sunken'];
              }
            } else {
              mine = null;
              theme = null;
            }
          }

          // 'system' is stored as an absent attribute on purpose, so an unknown value and the
          // system default land in the same place: leave the root alone and let the
          // prefers-color-scheme query in index.css answer. The bar is left to System's tags,
          // and the installed app's bar at the bottom to System's manifest.
          if (Object.prototype.hasOwnProperty.call(grounds, theme)) {
            root.setAttribute('data-theme', theme);

            var bar = document.createElement('meta');
            bar.name = 'theme-color';
            bar.content = ground || grounds[theme];
            document.head.insertBefore(bar, document.querySelector('meta[name="theme-color"]'));

            // The installed app's bar at the bottom is its manifest's theme_color, from the copy
            // Chrome keeps (#31). So a chosen theme links a manifest in its own ground, for Chrome
            // to find the next time it checks the app, and a theme of your own its base's.
            // Shelf Light's is System's, linked above. manifestOf in theme.ts is the same rule.
            var manifest = document.querySelector('link[rel="manifest"]');
            if (manifest && theme !== 'shelf-light') {
              manifest.setAttribute('href', '/manifest-' + theme + '.webmanifest');
            }
          }

          // Each kept value that can be stamped, inline, where it outranks the base's block. One
          // that is not a colour would paint nothing at all where it is used, so it is skipped
          // and the base's own answers for it.
          if (mine) {
            for (var name in mine.tokens) {
              var value = mine.tokens[name];
              if (
                /^--[a-z-]+$/.test(name) &&
                typeof value === 'string' &&
                /^(#[0-9a-f]{6}|transparent|[0-9 .,/()pxrgb]+)$/.test(value)
              ) {
                root.style.setProperty(name, value);
              }
            }
            root.style.setProperty('color-scheme', mine.scheme === 'light' ? 'light' : 'dark');
          }

          var density = localStorage.getItem('hobbytracker.density');
          document.documentElement.setAttribute(
            'data-density',
            density === 'compact' ? 'compact' : 'comfortable',
          );

          // A modal unless a drawer was chosen, which is DEFAULT_JOURNAL in theme.ts, and
          // theme.test.ts runs this script to hold the two together.
          var journal = localStorage.getItem('hobbytracker.journal');
          document.documentElement.setAttribute(
            'data-journal',
            journal === 'drawer' ? 'drawer' : 'modal',
          );
        } catch (error) {
          // No preference readable. The defaults in index.css are already correct.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
