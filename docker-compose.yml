# Local development database.
#   docker compose up -d db
#   docker compose exec db psql -U admin -d hobbytracker
#
# Credentials here are deliberately trivial: this container is bound to localhost
# and holds nothing but scratch data. Real secrets (IGDB client id/secret) live in
# dotnet user-secrets, never in a committed file.
services:
  db:
    image: postgres:17
    container_name: hobbytracker-db
    environment:
      POSTGRES_DB: hobbytracker
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hobbytracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
